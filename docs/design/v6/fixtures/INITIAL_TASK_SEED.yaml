household:
  timezone: Asia/Tokyo

members:
  - key: papa
    display_name: パパ
  - key: mama
    display_name: ママ

# NOTE:
# - actual dropoff/pickup clock times must be collected during setup.
# - evening role assignment is a setup proposal and requires explicit confirmation.
# - special preparation is normalized into ordinary task definitions/rules.

task_definitions:
  - code: dropoff
    title: 送り
    category: dropoff
    routine_phase: morning
    completion_mode: whole
    sort_order: 10

  - code: pickup
    title: お迎え
    category: pickup
    routine_phase: evening
    completion_mode: whole
    sort_order: 20

  - code: prep_monday_bedding
    title: 昼寝用寝具を入れる
    category: preparation
    routine_phase: morning
    completion_mode: whole
    sort_order: 30

  - code: prep_monday_uwabaki
    title: 洗った上履きを持っていく
    category: preparation
    routine_phase: morning
