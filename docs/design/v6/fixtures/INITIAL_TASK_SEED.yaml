      - title: 回す
        required: true
      - title: 干す/乾燥
        required: true
      - title: 取り込む
        required: true
      - title: 畳む
        required: true
      - title: 収納
        required: true

  - code: dishes
    title: 食器洗い
    category: dishes
    routine_phase: evening
    completion_mode: whole
    sort_order: 130

  - code: cleaning
    title: 掃除
    category: cleaning
    routine_phase: evening
    completion_mode: subtasks
    sort_order: 140
