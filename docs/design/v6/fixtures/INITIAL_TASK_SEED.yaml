    sort_order: 150

  - code: media_30min
    title: スマイルゼミ後のテレビ/ゲーム30分管理
    category: child_routine
    routine_phase: evening
    completion_mode: whole
    sort_order: 160

recurrence_rules:
  # scheduled_local_time intentionally null until setup asks actual times.
  - task: dropoff
    weekday: 1
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null
  - task: dropoff
    weekday: 2
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null
  - task: dropoff
    weekday: 3
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null
  - task: dropoff
    weekday: 4
    assignee_strategy: fixed
    assignee: mama
    scheduled_local_time: null
  - task: dropoff
    weekday: 5
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null

  - task: pickup
    weekday: 1
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null
  - task: pickup
    weekday: 2
    assignee_strategy: fixed
    assignee: mama
    scheduled_local_time: null
  - task: pickup
    weekday: 3
    assignee_strategy: fixed
