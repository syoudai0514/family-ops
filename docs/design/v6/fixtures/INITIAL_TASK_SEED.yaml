    scheduled_local_time: null
  - task: pickup
    weekday: 5
    assignee_strategy: fixed
    assignee: papa
    scheduled_local_time: null

  # Preparation follows that day's dropoff assignee.
  - task: prep_monday_bedding
    weekday: 1
    assignee_strategy: dropoff_assignee
    assignee: null
  - task: prep_monday_uwabaki
    weekday: 1
    assignee_strategy: dropoff_assignee
    assignee: null
