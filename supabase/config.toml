# schedule (02_UX_AND_SCREENS.md #3 Priority 1/2) — both are read/mutation
# gaps against already-built backend state, same class of gap as WP5's
# AI-draft endpoints above. All four are explicitly allowlisted in
# scripts/check-edge-auth-matrix.mjs's GAP_FILL_FUNCTIONS.
