# Family Ops — Supabase project config (v6)
project_id = "family-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_SIGNIN_CLIENT_ID)"
secret = "env(GOOGLE_SIGNIN_CLIENT_SECRET)"
redirect_uri = "env(GOOGLE_SIGNIN_CALLBACK_URL)"

[edge_runtime]
enabled = true
policy = "oneshot"

