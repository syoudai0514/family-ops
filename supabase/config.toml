verify_jwt = true

# v6 review fix (WP5, docs/adr/0003): the vendored 52-function matrix in
# docs/design/v6/supabase/config.toml has no propose-ai-draft,
# confirm-request-draft, or confirm-handover-draft entries â€” the AI-draft
# propose/confirm split is a genuine naming gap in the vendored design, not
# an invented v7 feature (18_MUTATION_CONTRACT_MATRIX.md #13 describes the
# flow in prose without settling on Edge Function names). All three are
# explicitly allowlisted in scripts/check-edge-auth-matrix.mjs's
# GAP_FILL_FUNCTIONS rather than silently loosening the check.
[functions.propose-ai-draft]
verify_jwt = true

[functions.confirm-request-draft]
verify_jwt = true

[functions.confirm-handover-draft]
verify_jwt = true

# Sol re-review #3 fix (P1-1/P1-2, docs/adr/0011): the vendored 52-function
# matrix has no endpoint for reading/confirming/cancelling a LINE-created
# pending_action from the PWA, nor for reading Today's calendar/conflict
# schedule (02_UX_AND_SCREENS.md #3 Priority 1/2) â€” both are read/mutation
# gaps against already-built backend state, same class of gap as WP5's
# AI-draft endpoints above. All four are explicitly allowlisted in
# scripts/check-edge-auth-matrix.mjs's GAP_FILL_FUNCTIONS.
[functions.list-pending-actions]
verify_jwt = true

[functions.confirm-pending-action]
verify_jwt = true

[functions.cancel-pending-action]
verify_jwt = true

[functions.get-today-schedule]
verify_jwt = true

[functions.get-week-schedule]
verify_jwt = true

[functions.set-routine-definition-options]
verify_jwt = true

[functions.replace-routine-subtasks]
verify_jwt = true

[functions.set-family-calendar-target]
verify_jwt = true

[functions.set-family-role]
verify_jwt = true

# External provider â€” verify_jwt = false (signature validated in-handler
# before any DB access)

[functions.line-webhook-receiver]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

# Browser top-level redirect from Google's OAuth consent screen â€” verify_jwt
# = false because there is no JWT on this request at all (docs/adr/0004):
# authenticated entirely by the single-use, TTL'd private.google_oauth_states
# state_hash row, not a bearer token.

[functions.google-calendar-oauth-callback]
verify_jwt = false

# Cron worker â€” verify_jwt = false (X-Family-Ops-Worker-Token constant-time
# compared in-handler before any DB access)

[functions.send-notifications]
verify_jwt = false

[functions.process-line-inbox]
verify_jwt = false

[functions.process-pending-actions]
verify_jwt = false

[functions.renew-google-watch]
verify_jwt = false

[functions.enqueue-periodic-google-sync]
verify_jwt = false

[functions.process-google-sync]
verify_jwt = false

[functions.process-family-ops-calendar-outbox]
verify_jwt = false

[functions.dispatch-routine-automation]
verify_jwt = false

[functions.materialize-recurring]
verify_jwt = false

[functions.sync-jp-holidays]
verify_jwt = false

[functions.cleanup-expired-private-data]
verify_jwt = false
