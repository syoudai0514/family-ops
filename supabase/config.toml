# Family Ops — Supabase project config (v6)
#
# The [functions.*] block below is the normative Edge Function gateway auth
# snapshot from docs/design/v6/EDGE_FUNCTION_AUTH_MATRIX.md and MUST NOT
# diverge from it. scripts/check-edge-auth-matrix.mjs enforces this in CI:
#   - every entry here matches the matrix doc's verify_jwt classification
#   - every function actually present under supabase/functions/ has an entry
#     here (no unknown/undeclared function is deployed)
#   - verify_jwt=false does not by itself mean "trusted" — provider/worker
#     in-handler authentication happens before any DB access; see
#     docs/design/v6/04_SECURITY_RLS_PRIVACY.md #"v6 Edge gateway requirement"

project_id = "family-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"

# ---------------------------------------------------------------------------
# User-facing — verify_jwt = true (actor derived from JWT sub -> household_members)
# ---------------------------------------------------------------------------

[functions.create-household]
verify_jwt = true

