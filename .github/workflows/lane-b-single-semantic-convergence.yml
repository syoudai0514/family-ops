name: Lane B single semantic convergence

on:
  push:
    branches: [sol/lane-b-concierge-correctness]
    paths: [.github/workflows/lane-b-single-semantic-convergence.yml]

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/lane-b-concierge-correctness
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Guarded source convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/process-line-inbox/index.ts')
          s = p.read_text()

          old = 'import { parseLineText } from "./parser.ts";\n'
          assert s.count(old) == 1, ('parse import', s.count(old))
          s = s.replace(old, '')

          old = '''import {\n  daypartLabel,\n  daypartToLocalTime,\n  extractLineIntent,\n} from "./lineIntent.ts";'''
          new = '''import {\n  daypartLabel,\n  daypartToLocalTime,\n} from "./lineIntent.ts";'''
          assert s.count(old) == 1, ('lineIntent import', s.count(old))
          s = s.replace(old, new)

          old = '''import {\n  decomposeLineConversationCandidates,\n  isMultiIntentMessage,\n  type LineMultiIntentPendingCandidate,\n} from "./lineMultiIntent.ts";'''
          new = '''import {\n  decomposeLineConversationCandidates,\n  type LineMultiIntentPendingCandidate,\n} from "./lineMultiIntent.ts";'''
          assert s.count(old) == 1, ('multi import', s.count(old))
          s = s.replace(old, new)

          old = '''  const interpreted = await decomposeLineConversationCandidates(text);\n  if (!isMultiIntentMessage(interpreted)) return [];\n  const identified = await Promise.all(interpreted.map(async (candidate) => ({'''
          new = '''  const interpreted = await decomposeLineConversationCandidates(text);\n  const identified = await Promise.all(interpreted.map(async (candidate) => ({'''
          assert s.count(old) == 1, ('multi gate', s.count(old))
          s = s.replace(old, new)

          old = '''async function tryCreateMultiIntentReview(\n  client: SupabaseClient,\n  item: WebhookInboxItem,\n  actor: LineActor,\n  text: string,\n): Promise<boolean> {\n  const candidates = await buildMultiIntentPendingCandidates(client, item, actor, text);\n  if (candidates.length === 0) return false;'''
          new = '''async function tryCreateMultiIntentReview(\n  client: SupabaseClient,\n  item: WebhookInboxItem,\n  actor: LineActor,\n  text: string,\n  candidates: LineMultiIntentPendingCandidate[],\n): Promise<boolean> {\n  if (candidates.length === 0) return false;'''
          assert s.count(old) == 1, ('review signature', s.count(old))
          s = s.replace(old, new)

          old = '''    const inferred = await extractLineIntent(text);\n    const payload = { ...pending.normalized_payload };'''
          new = '''    const inferredCandidates = await decomposeLineConversationCandidates(text);\n    const inferred = inferredCandidates.length === 1 ? inferredCandidates[0].intent : null;\n    const payload = { ...pending.normalized_payload };'''
          assert s.count(old) == 1, ('edit extractor', s.count(old))
          s = s.replace(old, new)

          old = '''  if (await tryHandlePendingReferent(client, item, actor, text)) return;\n  if (await tryApplyLineTextEdit(client, item, actor, text)) return;\n  if (await tryCreateMultiIntentReview(client, item, actor, text)) return;\n\n  const starterKind = lineCreationStarterKind(text);\n  const parsed = starterKind ? null : parseLineText(text);\n  let assignmentPayload: Record<string, unknown> | null = null;\n\n  if (!parsed && /(?:迎え.*お願い|お願い.*迎え)/.test(text)) {'''
          new = '''  if (await tryHandlePendingReferent(client, item, actor, text)) return;\n  if (await tryApplyLineTextEdit(client, item, actor, text)) return;\n\n  const starterKind = lineCreationStarterKind(text);\n  const semanticCandidates = starterKind\n    ? []\n    : await buildMultiIntentPendingCandidates(client, item, actor, text);\n  const semanticCandidate = semanticCandidates.length === 1 ? semanticCandidates[0] : null;\n  const needsCandidateReview = semanticCandidates.length > 1 || semanticCandidates.some((candidate) =>\n    candidate.missing_fields.length > 0 || Boolean(candidate.duplicate_match)\n  );\n  if (needsCandidateReview && await tryCreateMultiIntentReview(client, item, actor, text, semanticCandidates)) return;\n\n  let assignmentPayload: Record<string, unknown> | null = null;\n\n  if (!starterKind && /(?:迎え.*お願い|お願い.*迎え)/.test(text)) {'''
          assert s.count(old) == 1, ('handle semantic prelude', s.count(old))
          s = s.replace(old, new)

          start = s.index('  } else if (parsed) {')
          end_marker = '\n\n  const operationId = await deterministicOperationId("line-text", item.provider_event_id);'
          end = s.index(end_marker, start)
          replacement = '''  } else if (semanticCandidate) {\n    actionType = semanticCandidate.action_type;\n    payload = { ...semanticCandidate.payload, raw_text: text };\n  } else {\n    actionType = "needs_pwa_review";\n    payload = {\n      raw_text: text,\n      scheduled_date: correctionDate(text) ?? jstIsoDateOffset(0),\n      due_local_time: correctionTime(text) ?? null,\n    };\n  }'''
          s = s[:start] + replacement + s[end:]

          old = '  const operationId = await deterministicOperationId("line-text", item.provider_event_id);'
          new = '''  const operationId = semanticCandidate && !assignmentPayload && !starterKind\n    ? semanticCandidate.operation_id\n    : await deterministicOperationId("line-text", item.provider_event_id);'''
          assert s.count(old) == 1, ('operation id', s.count(old))
          s = s.replace(old, new)

          p.write_text(s)

          p = Path('supabase/functions/process-pending-actions/index.ts')
          s = p.read_text()
          old = '''import {\n  daypartLabel,\n  daypartToLocalTime,\n  extractLineIntent,\n  toTaskSubtasks,\n} from '../process-line-inbox/lineIntent.ts';\nimport {\n  activeMultiIntentCandidates,\n} from '../process-line-inbox/lineMultiIntent.ts';'''
          new = '''import {\n  daypartLabel,\n  daypartToLocalTime,\n  toTaskSubtasks,\n} from '../process-line-inbox/lineIntent.ts';\nimport {\n  activeMultiIntentCandidates,\n  decomposeLineConversationCandidates,\n} from '../process-line-inbox/lineMultiIntent.ts';'''
          assert s.count(old) == 1, ('pending imports', s.count(old))
          s = s.replace(old, new)

          old = '''  const intent = await extractLineIntent(rawText);\n  if (!intent) return null;'''
          new = '''  const semanticCandidates = await decomposeLineConversationCandidates(rawText);\n  const intent = semanticCandidates.length === 1 ? semanticCandidates[0].intent : null;\n  if (!intent) return null;'''
          assert s.count(old) == 1, ('pending extractor', s.count(old))
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Targeted checks and policy assertions
        working-directory: supabase/functions
        shell: bash
        run: |
          deno lint process-line-inbox/index.ts process-line-inbox/lineMultiIntent.ts process-pending-actions/index.ts
          deno check process-line-inbox/index.ts
          deno check process-pending-actions/index.ts
          deno test --allow-env process-line-inbox/lineMultiIntent.test.ts
          cd ../..
          if git grep -n -F 'extractLineIntent' -- supabase/functions/process-line-inbox/index.ts supabase/functions/process-pending-actions/index.ts; then
            echo 'legacy single-intent re-interpretation remains in LINE initial/pending paths'
            exit 1
          fi
          if git grep -n -F 'parseLineText' -- supabase/functions/process-line-inbox/index.ts; then
            echo 'legacy deterministic parser remains in LINE initial interpretation path'
            exit 1
          fi
          if sed -n '300,500p' supabase/functions/process-pending-actions/index.ts | grep -F 'crypto.randomUUID'; then
            echo 'fresh UUID remains in pending business execution region'
            exit 1
          fi
          echo 'ASSERT_OK: single and multi LINE interpretation converge on shared semantic candidate; persisted operation IDs execute unchanged.'
      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/lane-b-single-semantic-convergence.yml
          git config user.name "family-ops-lane-b"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/process-line-inbox/index.ts supabase/functions/process-pending-actions/index.ts .github/workflows/lane-b-single-semantic-convergence.yml
          git commit -m "CF-08 converge LINE single and multi semantic interpretation"
          git push origin HEAD:sol/lane-b-concierge-correctness
