name: XC CF14 status convergence

on:
  push:
    branches:
      - integration/family-ops-final-candidate
    paths:
      - '.github/workflows/xc-cf14-status-convergence.yml'

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/family-ops-final-candidate
          fetch-depth: 0
      - name: Reclassify resolved XC-03 implementation blockers as F2 external evidence pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          scenarios = Path('tests/evidence/cf14/scenarios.mjs')
          s = scenarios.read_text()
          ids = [
              'CF14-REQUEST-LIFECYCLE',
              'CF14-CHECKIN-RECONCILIATION',
              'CF14-LINE-DAILY-ENTRY',
              'CF14-Q27-LINE-WEBHOOK-POSTBACK',
              'CF14-WHOLE-DAY-ORCHESTRATION',
          ]
          for scenario_id in ids:
              pattern = rf"(scenarioId: '{re.escape(scenario_id)}',[\s\S]*?)(?=\n  \}},\n  \{{|\n  \}},\n\];)"
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit(f'scenario not found: {scenario_id}')
              block = m.group(1)
              block2 = re.sub(r"status: '(?:expected-failing|skeleton)',", "status: 'external-pending',", block)
              block2 = re.sub(r"\n    expectedFailureReason: '[^']*',", '', block2)
              if block2 == block:
                  raise SystemExit(f'scenario status not changed: {scenario_id}')
              s = s[:m.start(1)] + block2 + s[m.end(1):]
          scenarios.write_text(s)

          doc = Path('docs/implementation/CF14-REQUIREMENT-EVIDENCE-MATRIX.md')
          d = doc.read_text()
          replacements = {
            "| CF14-REQUEST-LIFECYCLE | Q2,Q30,Q36,Q41-Q47,Q51 | PWA + LINE Request entry | domain, DB, Edge, browser, LINE | expected-failing / Astra XC-03 LINE consultation entry missing |":
            "| CF14-REQUEST-LIFECYCLE | Q2,Q30,Q36,Q41-Q47,Q51 | PWA + LINE Request entry | domain, DB, Edge, browser, LINE | external-pending / canonical LINE lifecycle implemented; actual LINE transport evidence remains F2 |",
            "| CF14-CHECKIN-RECONCILIATION | Q5,Q6,Q31,Q53,Q54,Q59-Q61,Q63,Q64,Q76 | PWA/LINE check-in | domain, DB, Edge, browser, LINE, whole-day | expected-failing / Astra XC-03 |":
            "| CF14-CHECKIN-RECONCILIATION | Q5,Q6,Q31,Q53,Q54,Q59-Q61,Q63,Q64,Q76 | PWA/LINE check-in | domain, DB, Edge, browser, LINE, whole-day | external-pending / canonical LINE reconciliation+undo implemented; transport/whole-day evidence remains F2 |",
            "| CF14-LINE-DAILY-ENTRY | Q4,Q39,Q65-Q67,Q72,Q73,Q78-Q80 | actual LINE webhook/postback | domain, DB, Edge, LINE, browser, concurrency | expected-failing / Astra XC-03 |":
            "| CF14-LINE-DAILY-ENTRY | Q4,Q39,Q65-Q67,Q72,Q73,Q78-Q80 | actual LINE webhook/postback | domain, DB, Edge, LINE, browser, concurrency | external-pending / LINE canonical daily entry implemented; actual transport/concurrency evidence remains F2 |",
            "| CF14-Q27-LINE-WEBHOOK-POSTBACK | Q27 | signed LINE-compatible HTTP webhook/postback, then actual provider in F2 | DB, Edge, LINE | expected-failing / Astra XC-03 |":
            "| CF14-Q27-LINE-WEBHOOK-POSTBACK | Q27 | signed LINE-compatible HTTP webhook/postback, then actual provider in F2 | DB, Edge, LINE | external-pending / one-user LINE adapter implemented; actual LINE provider evidence remains F2 |",
            "| CF14-WHOLE-DAY-ORCHESTRATION | cross-cuts Q1,Q5,Q9,Q14,Q23,Q25,Q26,Q39,Q40,Q63,Q75,Q87,Q88 | morning → daytime → evening | browser, LINE, iPhone, concurrency, whole-day | skeleton |":
            "| CF14-WHOLE-DAY-ORCHESTRATION | cross-cuts Q1,Q5,Q9,Q14,Q23,Q25,Q26,Q39,Q40,Q63,Q75,Q87,Q88 | morning → daytime → evening | browser, LINE, iPhone, concurrency, whole-day | external-pending / orchestration harness authored; exact-head external execution remains F2 |",
          }
          for old, new in replacements.items():
              if old not in d:
                  raise SystemExit('CF14 table contract string not found: ' + old[:80])
              d = d.replace(old, new)

          old_paragraph = "Conversely, Request lifecycle, check-in, LINE daily entry and Q27 are\n`expected-failing` because source inspection proves required LINE operations have\nno production entry point (Astra XC-03). Whole-day remains a skeleton. These\nstatuses must only be cleared with implementation and entry-point verification.\nThe assessor and its missing-evidence / known-defect guards are unchanged. Its\nknown-defect regression uses an explicit synthetic defect so correcting Shopping\ndoes not remove guard coverage."
          new_paragraph = "Request lifecycle, check-in, LINE daily entry and Q27 no longer carry an implementation-known-defect status: the production LINE worker now routes those normal actions through the shared canonical commands with revision-bearing postbacks and user-visible fail-closed handling. Whole-day orchestration is also authored and is now classified as external-pending. Actual LINE/provider/device/concurrency/whole-day execution remains F2 evidence and is deliberately not claimed here. The assessor and its missing-evidence / known-defect guards are unchanged; the known-defect regression continues to use an explicit synthetic defect."
          if old_paragraph not in d:
              raise SystemExit('CF14 convergence narrative not found')
          d = d.replace(old_paragraph, new_paragraph)
          doc.write_text(d)
          PY
      - name: Commit F1 status convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/evidence/cf14/scenarios.mjs docs/implementation/CF14-REQUIREMENT-EVIDENCE-MATRIX.md
          git commit -m 'docs(test): classify resolved XC blockers as F2 external pending'
          git push origin HEAD:integration/family-ops-final-candidate
