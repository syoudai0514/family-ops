name: Deploy LINE UX v5 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_deploy-line-ux-v5-production.yml'

permissions:
  contents: read

concurrency:
  group: family-ops-line-ux-v5-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Require production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is required"
            exit 1
          }

      - name: Deploy LINE UX affected functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in process-line-inbox process-pending-actions send-notifications; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done

      - name: Verify deployed functions are listed
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF"
