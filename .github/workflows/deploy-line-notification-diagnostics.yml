name: Deploy LINE notification diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-line-notification-diagnostics-deploy
  cancel-in-progress: false

jobs:
  deploy-send-notifications-only:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
      - name: Deploy only send-notifications
        shell: bash
        run: supabase functions deploy send-notifications --project-ref "$PROJECT_REF" --use-api
