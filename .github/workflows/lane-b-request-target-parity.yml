name: Lane B request target parity

on:
  push:
    branches: [sol/lane-b-concierge-correctness]
    paths: [.github/workflows/lane-b-request-target-parity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/lane-b-concierge-correctness
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Guarded request target projection patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/process-line-inbox/index.ts')
          s = p.read_text()
          old = '''    if (candidate.kind === "request") {\n      return {\n        ...base,\n        action_type: "request_create" as const,\n        missing_fields: partner ? base.missing_fields : [...base.missing_fields, "お願いする相手"],\n        payload: {\n          title: candidate.title,\n          shared_message: intent?.sharedMessage ?? `${candidate.title}をお願いできますか？`,\n          recipient_user_id: partner,\n          scheduled_date: intent?.scheduledDate ?? jstIsoDateOffset(0),\n          due_local_time: intent?.dueLocalTime ?? null,\n        },\n      };\n    }'''
          new = '''    if (candidate.kind === "request") {\n      const explicitRecipient = intent?.targetRole\n        ? await householdUserForRole(client, actor.household_id, intent.targetRole)\n        : null;\n      const recipient = explicitRecipient ?? partner;\n      return {\n        ...base,\n        action_type: "request_create" as const,\n        missing_fields: recipient ? base.missing_fields : [...base.missing_fields, "お願いする相手"],\n        payload: {\n          title: candidate.title,\n          shared_message: intent?.sharedMessage ?? `${candidate.title}をお願いできますか？`,\n          recipient_user_id: recipient,\n          scheduled_date: intent?.scheduledDate ?? jstIsoDateOffset(0),\n          due_local_time: intent?.dueLocalTime ?? null,\n        },\n      };\n    }'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
      - name: Targeted checks
        working-directory: supabase/functions
        run: |
          deno lint process-line-inbox/index.ts
          deno check process-line-inbox/index.ts
          deno test --allow-env process-line-inbox/lineMultiIntent.test.ts process-line-inbox/lineSemanticParity.test.ts
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/lane-b-request-target-parity.yml
          git config user.name "family-ops-lane-b"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/process-line-inbox/index.ts .github/workflows/lane-b-request-target-parity.yml
          git commit -m "CF-08 preserve explicit request assignee across LINE and PWA"
          git push origin HEAD:sol/lane-b-concierge-correctness
