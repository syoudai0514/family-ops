name: Deploy remaining Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy-missing-only:
    name: Deploy the 14 functions missing on 2026-08-21
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Require deployment credential
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required."
            exit 1
          }

      - name: Deploy only functions confirmed absent from production
        shell: bash
        run: |
          set -euo pipefail
          missing=(
            process-pending-actions
            propose-ai-draft
            purchase-shopping-item
            reassign-task-once
            renew-google-watch
            routine-session-item-action
            send-notifications
            send-request
            set-subtask-completion
            sync-jp-holidays
            unlink-line-account
            update-calendar-event
            update-notification-preferences
            update-routine-schedule
          )
          for function_name in "${missing[@]}"; do
            echo "Deploying ${function_name}"
            supabase functions deploy "${function_name}" \
              --project-ref "$PROJECT_REF" \
              --use-api
          done

      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
