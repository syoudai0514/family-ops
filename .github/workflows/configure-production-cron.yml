name: Configure production notification cron

on:
  push:
    branches: [main]
    paths: [.github/workflows/configure-production-cron.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-production-cron
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - name: Register LINE and Family Ops workers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          read -r -d '' SQL <<'SQL' || true
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          do $$
          declare
            worker_token text;
          begin
            select decrypted_secret into worker_token
              from vault.decrypted_secrets where name = 'CRON_WORKER_TOKEN' limit 1;
            if worker_token is null or length(worker_token) = 0 then
              raise exception 'CRON_WORKER_TOKEN is missing from Vault';
            end if;
            perform cron.unschedule(jobid) from cron.job
              where jobname in (
                'family-ops-line-inbox-v1',
                'family-ops-pending-actions-v1',
                'family-ops-routine-dispatch-v1',
                'family-ops-line-delivery-v1',
                'family-ops-calendar-outbox-v1'
              );
            perform cron.schedule('family-ops-line-inbox-v1', '* * * * *',
              format($job$select net.http_post(url := 'https://dnlqxjpjpkxnfgculzip.supabase.co/functions/v1/process-line-inbox', headers := jsonb_build_object('Content-Type','application/json','X-Family-Ops-Worker-Token',%L), body := '{}'::jsonb)$job$, worker_token));
            perform cron.schedule('family-ops-pending-actions-v1', '* * * * *',
              format($job$select net.http_post(url := 'https://dnlqxjpjpkxnfgculzip.supabase.co/functions/v1/process-pending-actions', headers := jsonb_build_object('Content-Type','application/json','X-Family-Ops-Worker-Token',%L), body := '{}'::jsonb)$job$, worker_token));
            perform cron.schedule('family-ops-routine-dispatch-v1', '* * * * *',
              format($job$select net.http_post(url := 'https://dnlqxjpjpkxnfgculzip.supabase.co/functions/v1/dispatch-routine-automation', headers := jsonb_build_object('Content-Type','application/json','X-Family-Ops-Worker-Token',%L), body := '{}'::jsonb)$job$, worker_token));
            perform cron.schedule('family-ops-line-delivery-v1', '* * * * *',
              format($job$select net.http_post(url := 'https://dnlqxjpjpkxnfgculzip.supabase.co/functions/v1/send-notifications', headers := jsonb_build_object('Content-Type','application/json','X-Family-Ops-Worker-Token',%L), body := '{}'::jsonb)$job$, worker_token));
            perform cron.schedule('family-ops-calendar-outbox-v1', '* * * * *',
              format($job$select net.http_post(url := 'https://dnlqxjpjpkxnfgculzip.supabase.co/functions/v1/process-family-ops-calendar-outbox', headers := jsonb_build_object('Content-Type','application/json','X-Family-Ops-Worker-Token',%L), body := '{}'::jsonb)$job$, worker_token));
          end $$;
          select jobname, schedule from cron.job where jobname like 'family-ops-%' order by jobname;
          SQL
          payload=$(jq -n --arg query "$SQL" '{query: $query}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -e .
