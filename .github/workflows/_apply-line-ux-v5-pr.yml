name: Apply LINE UX v5 on PR

on:
  pull_request:
    paths:
      - '.line-ux-v5-trigger'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Apply reviewed LINE UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/_apply-line-ux-v5.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start:end]
          first = next(line for line in body if line.strip())
          indent = len(first) - len(first.lstrip(' '))
          code = '\n'.join(line[indent:] if len(line) >= indent else line for line in body) + '\n'
          exec(compile(code, str(workflow) + '::<patch>', 'exec'), {'__name__': '__main__'})
          PY
          sed -i 's/明日の朝、歯医者の予約をパパのタスクとして追加して/明日の朝、歯医者の予約して、パパのタスクとして追加/g' supabase/functions/process-line-inbox/lineIntent.test.ts
          deno fmt supabase/functions/process-line-inbox supabase/functions/_shared/lineMessageBuilders.ts

      - name: Focused LINE regression
        working-directory: supabase/functions
        run: |
          deno test --allow-env process-line-inbox/lineConversation.test.ts process-line-inbox/lineIntent.test.ts
          deno check process-line-inbox/index.ts
          deno lint process-line-inbox _shared/lineMessageBuilders.ts

      - name: Full Edge regression
        working-directory: supabase/functions
        run: deno test --allow-env

      - name: Web regression
        run: |
          npm ci
          npm run lint -w apps/web
          npm run typecheck -w apps/web
          npm run test -w apps/web
          VITE_SUPABASE_URL=https://ci-placeholder.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-key npm run build -w apps/web

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/process-line-inbox supabase/functions/_shared/lineMessageBuilders.ts
          if git diff --cached --quiet; then
            echo 'No implementation diff found'
            exit 1
          fi
          git commit -m 'feat(line): implement guided conversational UX'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
