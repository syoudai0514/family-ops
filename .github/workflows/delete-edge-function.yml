name: Delete one Edge Function

# Removes exactly one Edge Function from production, by name. Only a function
# that has already been removed from the repository (no directory under
# supabase/functions and no entry in supabase/config.toml) can be deleted, so a
# live function cannot be taken down by a typo.

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Edge Function name already removed from supabase/functions (e.g. mark-notification-read)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: family-ops-edge-function-deploy-${{ inputs.function_name }}
  cancel-in-progress: false

jobs:
  delete-one:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
      FUNCTION_NAME: ${{ inputs.function_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Validate function name and credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          [[ "$FUNCTION_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid function name"; exit 1; }
          test ! -e "supabase/functions/${FUNCTION_NAME}" || { echo "::error::${FUNCTION_NAME} is still in the repository"; exit 1; }
          ! grep -q "^\[functions\.${FUNCTION_NAME}\]" supabase/config.toml || { echo "::error::${FUNCTION_NAME} is still registered in supabase/config.toml"; exit 1; }
          ! grep -rq -- "${FUNCTION_NAME}" apps/web/src/lib/edgeFunctions.ts || { echo "::error::the web app still calls ${FUNCTION_NAME}"; exit 1; }
      - name: Delete
        shell: bash
        run: supabase functions delete "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
