name: Kick LINE UX v5

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  kick:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trigger apply workflow exactly once
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/_apply-line-ux-v5.yml
          if grep -q '^# kicked$' "$file"; then
            echo 'already kicked'
            exit 0
          fi
          printf '\n# kicked\n' >> "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'chore: trigger LINE UX v5 apply workflow'
          git push origin main
