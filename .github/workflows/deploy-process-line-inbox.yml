name: Deploy process-line-inbox

# Deploys only the LINE inbox worker, from the ref it is dispatched on.
# Same shape as deploy-line-notification-diagnostics.yml (send-notifications only).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-process-line-inbox-deploy
  cancel-in-progress: false

jobs:
  deploy-process-line-inbox-only:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
      - name: Deploy only process-line-inbox
        shell: bash
        run: supabase functions deploy process-line-inbox --project-ref "$PROJECT_REF" --use-api
