name: F2 Supabase frozen-head Edge sync

on:
  push:
    branches:
      - f2-supabase-prod-sync-6b836b7e
    paths:
      - '.github/workflows/f2-supabase-edge-sync.yml'

permissions:
  contents: read

concurrency:
  group: family-ops-f2-supabase-prod-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
      FROZEN_HEAD: 6b836b7e420821150acb85033122a313d394ce64
    steps:
      - name: Checkout frozen F2 candidate exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_HEAD }}
          fetch-depth: 1

      - name: Verify exact source and slot-swap assumptions
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Frozen HEAD: $FROZEN_HEAD"
          echo "Actual HEAD: $actual"
          test "$actual" = "$FROZEN_HEAD"
          test -d supabase/functions/commit-concierge-duplicate
          test ! -d supabase/functions/artifact-handoff-relay

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is required"
            exit 1
          }

      - name: Remove deployed-only expired artifact relay to free one Free-plan slot
        shell: bash
        run: |
          set -euo pipefail
          help="$(supabase functions delete --help 2>&1 || true)"
          if printf '%s' "$help" | grep -q -- '--yes'; then
            supabase functions delete artifact-handoff-relay --project-ref "$PROJECT_REF" --yes
          else
            printf 'y\n' | supabase functions delete artifact-handoff-relay --project-ref "$PROJECT_REF"
          fi

      - name: Deploy candidate commit-concierge-duplicate from frozen HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying commit-concierge-duplicate from $(git rev-parse HEAD)"
          supabase functions deploy commit-concierge-duplicate --project-ref "$PROJECT_REF" --use-api

      - name: Show final deployed function state
        shell: bash
        run: supabase functions list --project-ref "$PROJECT_REF"
