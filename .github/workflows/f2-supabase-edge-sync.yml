name: F2 Supabase frozen-head Edge sync

on:
  push:
    branches:
      - f2-supabase-prod-sync-6b836b7e
    paths:
      - '.github/workflows/f2-supabase-edge-sync.yml'

permissions:
  contents: read

concurrency:
  group: family-ops-f2-supabase-prod-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
      FROZEN_HEAD: 6b836b7e420821150acb85033122a313d394ce64
    steps:
      - name: Checkout frozen F2 candidate exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_HEAD }}
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Frozen HEAD: $FROZEN_HEAD"
          echo "Actual HEAD: $actual"
          test "$actual" = "$FROZEN_HEAD"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is required"
            exit 1
          }

      - name: Deploy remaining existing authenticated Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            confirm-request-draft
            decline-request
            negotiate-request
            propose-concierge-candidates
            respond-request
          )
          for fn in "${functions[@]}"; do
            echo "Deploying $fn from $(git rev-parse HEAD)"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done

      - name: Deploy remaining existing worker Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            dispatch-routine-automation
            process-line-inbox
            process-pending-actions
            send-notifications
          )
          for fn in "${functions[@]}"; do
            echo "Deploying $fn from $(git rev-parse HEAD) with in-handler worker auth"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          done

      - name: Show deployed function state
        shell: bash
        run: supabase functions list --project-ref "$PROJECT_REF"
