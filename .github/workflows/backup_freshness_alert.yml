name: Backup freshness alert

# Independent CF-11 freshness check for the right-sized separate-Supabase
# household snapshot. A failed backup is already RED; after a successful
# backup this workflow verifies the stored snapshot metadata and exact age.

on:
  schedule:
    # A few hours after the daily 18:00 UTC snapshot.
    - cron: "0 21 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Backup (daily household recovery snapshot)"
    types:
      - completed

permissions:
  contents: read

jobs:
  freshness:
    name: Check latest household snapshot age
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_PROJECT_REF: dnlqxjpjpkxnfgculzip
      TARGET_PROJECT_REF: wdwbmvpipbdpomqulsrj
      MAX_BACKUP_AGE_HOURS: "26"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify separate-project snapshot freshness
        run: bash scripts/backup_freshness_check.sh
