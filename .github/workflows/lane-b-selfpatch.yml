name: Lane B guarded self patch

on:
  push:
    branches:
      - sol/lane-b-concierge-correctness
    paths:
      - .github/workflows/lane-b-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'CF-08 converge LINE worker on shared semantic contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/lane-b-concierge-correctness
          fetch-depth: 0
      - name: Apply guarded replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pending_path = Path('supabase/functions/process-pending-actions/index.ts')
          pending = pending_path.read_text()
          derived = re.compile(r"\nasync function derivedOperationId\(parentOperationId: string, suffix: string\): Promise<string> \{.*?\n\}\n", re.S)
          pending, count = derived.subn("\n", pending, count=1)
          assert count == 1, f'derivedOperationId block count={count}'
          old = "operation_id: await derivedOperationId(item.operation_id, candidate.candidate_id),"
          assert pending.count(old) == 1, f'runtime candidate operation path count={pending.count(old)}'
          pending = pending.replace(old, "operation_id: candidate.operation_id,")
          pending_path.write_text(pending)

          line_path = Path('supabase/functions/process-line-inbox/index.ts')
          line = line_path.read_text()
          old_import = '''import {
            deterministicLineConversationCandidates,
            isMultiIntentMessage,
            type LineMultiIntentPendingCandidate,
          } from "./lineMultiIntent.ts";'''
          new_import = '''import {
            decomposeLineConversationCandidates,
            isMultiIntentMessage,
            type LineMultiIntentPendingCandidate,
          } from "./lineMultiIntent.ts";'''
          assert line.count(old_import) == 1, f'lineMultiIntent import count={line.count(old_import)}'
          line = line.replace(old_import, new_import)

          auth_import = '''import {
            createServiceRoleClient,
            requireWorkerToken,
          } from "../_shared/auth.ts";'''
          duplicate_import = auth_import + '\nimport { attachCanonicalConciergeDuplicate } from "../_shared/conciergeDuplicateMatch.ts";'
          assert line.count(auth_import) == 1, f'auth import count={line.count(auth_import)}'
          line = line.replace(auth_import, duplicate_import)

          old_sig = '''async function buildMultiIntentPendingCandidates(
            client: SupabaseClient,
            actor: LineActor,
            text: string,
          ): Promise<LineMultiIntentPendingCandidate[]> {
            const candidates = deterministicLineConversationCandidates(text);
            if (!isMultiIntentMessage(candidates)) return [];
            const partner = await partnerUserId(client, actor);
            return Promise.all(candidates.map(async (candidate) => {'''
          new_sig = '''async function buildMultiIntentPendingCandidates(
            client: SupabaseClient,
            item: WebhookInboxItem,
            actor: LineActor,
            text: string,
          ): Promise<LineMultiIntentPendingCandidate[]> {
            // Whole-utterance AI decomposition is the normal semantic path.
            // The shared helper alone owns deterministic availability fallback.
            const interpreted = await decomposeLineConversationCandidates(text);
            if (!isMultiIntentMessage(interpreted)) return [];
            const identified = await Promise.all(interpreted.map(async (candidate) => ({
              ...candidate,
              operationId: candidate.operationId ?? await deterministicOperationId(
                "line-candidate", item.provider_event_id, candidate.candidateId,
              ),
            })));
            const candidates = await Promise.all(identified.map((candidate) =>
              attachCanonicalConciergeDuplicate(client, actor.household_id, candidate)
            ));
            const partner = await partnerUserId(client, actor);
            return Promise.all(candidates.map(async (candidate) => {'''
          assert line.count(old_sig) == 1, f'buildMultiIntent signature/body count={line.count(old_sig)}'
          line = line.replace(old_sig, new_sig)

          old_base = '''      candidate_id: candidate.candidateId,
                kind: candidate.kind,
                title: candidate.title,
                source_text: candidate.sourceText,
                status: "draft" as const,
                missing_fields: [...candidate.missingFields],'''
          new_base = '''      candidate_id: candidate.candidateId,
                operation_id: candidate.operationId,
                kind: candidate.kind,
                title: candidate.title,
                source_text: candidate.sourceText,
                source_span: candidate.sourceSpan,
                confidence: candidate.confidence,
                ambiguous_fields: [...candidate.ambiguousFields],
                duplicate_match: candidate.duplicateMatch,
                status: "draft" as const,
                missing_fields: [...candidate.missingFields],'''
          assert line.count(old_base) == 1, f'pending candidate base count={line.count(old_base)}'
          line = line.replace(old_base, new_base)

          old_call = 'const candidates = await buildMultiIntentPendingCandidates(client, actor, text);'
          assert line.count(old_call) == 1, f'buildMultiIntent call count={line.count(old_call)}'
          line = line.replace(old_call, 'const candidates = await buildMultiIntentPendingCandidates(client, item, actor, text);')

          line_path.write_text(line)
          Path('.github/workflows/lane-b-selfpatch.yml').unlink()
          PY
      - name: Commit worker convergence
        shell: bash
        run: |
          git config user.name "family-ops-lane-b"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/process-pending-actions/index.ts supabase/functions/process-line-inbox/index.ts .github/workflows/lane-b-selfpatch.yml
          git commit -m "CF-08 converge LINE worker on shared semantic contract"
          git push origin HEAD:sol/lane-b-concierge-correctness
