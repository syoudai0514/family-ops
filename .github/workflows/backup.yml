name: Backup (daily household recovery snapshot)

# CF-11 right-sized by Product Owner decision (ADR 0014).
#
# Current household scale is two people. The recovery objective is to retain
# durable household/domain data if the Family Ops Supabase project suffers an
# operator mistake or project-level failure. We intentionally reuse existing
# infrastructure:
# - GitHub Actions
# - existing SUPABASE_ACCESS_TOKEN
# - existing separate Supabase project app-save-hub (also used by ManaEvo)
#
# R2, age encryption, owner-local crypto keys, DB passwords and provider
# credentials are not part of the current requirement. See
# docs/design/current/10_BACKUP_RECOVERY.md and docs/BACKUP_RESTORE_RUNBOOK.md.

on:
  schedule:
    # 18:00 UTC = 03:00 JST.
    - cron: "0 18 * * *"
  workflow_dispatch: {}
  # This gives the right-size implementation one real proof immediately after
  # protected merge, without needing a separate manual dispatch tool.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backup.yml"
      - ".github/workflows/backup_freshness_alert.yml"
      - ".github/workflows/recovery-drill.yml"
      - "scripts/create_household_snapshot.sh"
      - "scripts/backup_freshness_check.sh"
      - "scripts/restore_drill.sh"
      - "scripts/family_ops_recovery_tables.txt"
      - "docs/BACKUP_RESTORE_RUNBOOK.md"
      - "docs/design/current/10_BACKUP_RECOVERY.md"
      - "docs/adr/0014-right-sized-household-backup-recovery.md"

permissions:
  contents: read

concurrency:
  group: family-ops-household-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Snapshot durable household data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_PROJECT_REF: dnlqxjpjpkxnfgculzip
      TARGET_PROJECT_REF: wdwbmvpipbdpomqulsrj
      MAX_BACKUPS: "30"
    steps:
      - uses: actions/checkout@v4

      - name: Create, store and read-back verify household snapshot
        shell: bash
        run: bash scripts/create_household_snapshot.sh
