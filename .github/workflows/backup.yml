name: Backup (daily encrypted logical dump to R2)

# WP10 (docs/design/v6/10_WORK_PACKAGES.md): daily logical dump, age
# encryption using ONLY the public key in CI, upload to a private
# Cloudflare R2 bucket. See docs/BACKUP_RESTORE_RUNBOOK.md for the restore
# side of this — restore/decryption never happens in CI, only locally with
# the owner's age private key.
#
# Security property (do not weaken): this workflow must reference only
# BACKUP_AGE_PUBLIC_KEY (a public key — safe even if CI secrets leak). The
# matching private key is held by the household owner outside of GitHub
# entirely (password manager / offline storage) and is NEVER added as a
# secret here. Do not add any private-key material to CI to automate
# restores; that defeats the whole point of this design.
#
# Restore-compatibility property (do not weaken): production is Supabase,
# not a vanilla Postgres cluster. Raw pg_dump includes Supabase-managed
# internals and can produce dumps that fail on restore. Use Supabase CLI's
# filtered dump path and preserve migration history explicitly.

on:
  schedule:
    # 18:00 UTC = 03:00 JST (household is Asia/Tokyo per v6). Chosen well
    # after any late-evening app usage (evening routine / LINE automation
    # windows) and well before the household's morning.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Compute backup filename
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "filename=family-ops-backup-$(date -u +%Y-%m-%d).tar.age" >> "$GITHUB_OUTPUT"

      - name: Dump Supabase-compatible logical backup
        env:
          # Percent-encoded Postgres connection string from Supabase project
          # Database settings. Use direct/session connection, never a
          # transaction-mode pooler endpoint.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set" >&2
            exit 1
          fi

          # Supabase CLI wraps pg_dump with Supabase-specific filtering so
          # managed schemas/reserved roles are handled portably. Keep schema,
          # data, roles and migration history as separate members so restore
          # can apply them in the documented order.
          supabase db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql \
            --data-only --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f history_schema.sql \
            --schema supabase_migrations
          supabase db dump --db-url "$SUPABASE_DB_URL" -f history_data.sql \
            --data-only --use-copy --schema supabase_migrations

          for file in roles.sql schema.sql data.sql history_schema.sql history_data.sql; do
            test -s "$file" || { echo "::error::Supabase dump member $file is empty" >&2; exit 1; }
          done

          tar -cf logical-backup.tar \
            roles.sql schema.sql data.sql history_schema.sql history_data.sql
          test -s logical-backup.tar || { echo "::error::logical backup bundle is empty" >&2; exit 1; }
          rm -f roles.sql schema.sql data.sql history_schema.sql history_data.sql

      - name: Encrypt backup bundle with age (public key only)
        env:
          # age public key (recipient), e.g. "age1..." — generated once by
          # the owner via `age-keygen`, only the public half is stored here.
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_AGE_PUBLIC_KEY:-}" ]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY secret is not set" >&2
            exit 1
          fi
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "${{ steps.meta.outputs.filename }}" logical-backup.tar
          test -s "${{ steps.meta.outputs.filename }}" || { echo "::error::age produced an empty encrypted backup" >&2; exit 1; }
          rm -f logical-backup.tar

      - name: Upload and verify encrypted dump in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # Private R2 bucket name, per v6: `family-ops-backups`.
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v secret is not set" >&2
              exit 1
            fi
          done
          pipx install awscli --quiet 2>/dev/null || pip install --quiet awscli
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BACKUP_FILE="${{ steps.meta.outputs.filename }}"
          aws s3 cp \
            "$BACKUP_FILE" \
            "s3://${R2_BUCKET_NAME}/${BACKUP_FILE}" \
            --endpoint-url "$ENDPOINT_URL" \
            --storage-class STANDARD

          # Do not advance latest-backup.txt until R2 itself confirms that
          # the encrypted object exists and is non-empty.
          OBJECT_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "$BACKUP_FILE" \
            --endpoint-url "$ENDPOINT_URL" \
            --query ContentLength \
            --output text)"
          if ! [[ "$OBJECT_SIZE" =~ ^[0-9]+$ ]] || [ "$OBJECT_SIZE" -le 0 ]; then
            echo "::error::R2 head-object did not confirm a non-empty encrypted backup" >&2
            exit 1
          fi
          echo "Verified encrypted backup object in R2 (${OBJECT_SIZE} bytes)."

      - name: Update latest-backup marker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' \
            "${{ steps.meta.outputs.filename }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest-backup.txt
          aws s3 cp latest-backup.txt "s3://${R2_BUCKET_NAME}/latest-backup.txt" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Cleanup local artifacts
        if: always()
        run: |
          rm -f logical-backup.tar roles.sql schema.sql data.sql \
            history_schema.sql history_data.sql \
            "${{ steps.meta.outputs.filename }}" latest-backup.txt
