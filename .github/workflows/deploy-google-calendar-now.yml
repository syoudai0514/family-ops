name: Deploy Google Calendar production functions

on:
  push:
    branches:
      - ops/google-calendar-production-deploy

permissions:
  contents: read

concurrency:
  group: family-ops-google-calendar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Require deployment credential
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required."
            exit 1
          }

      - name: Deploy Google Calendar functions from current source
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            google-calendar-oauth-callback
            set-family-calendar-target
            process-family-ops-calendar-outbox
            process-google-sync
            renew-google-watch
          )
          for function_name in "${functions[@]}"; do
            echo "Deploying ${function_name}"
            supabase functions deploy "${function_name}" \
              --project-ref "$PROJECT_REF" \
              --use-api
          done

      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
