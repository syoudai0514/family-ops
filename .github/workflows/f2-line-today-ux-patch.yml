name: F2 LINE Today UX patch

on:
  push:
    branches: [f2-line-today-ux-patch-a7d3]
    paths: ['.github/workflows/f2-line-today-ux-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/family-ops-final-candidate
          fetch-depth: 0

      - name: Verify expected candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          expected=a7d3a4c3e2fad3ecbe96e3b5266f47f38f432a64
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Wire Today links and LINE acknowledgement flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('supabase/functions/process-line-inbox/index.ts')
          text = index.read_text()
          old_import = '''import {
            tryHandleLineMustCompletePostback,
            tryHandleLineMustCompleteText,
          } from "./lineMustComplete.ts";'''
          new_import = old_import + '''
          import {
            appendTodayDetailLinks,
            todayContextQuickReplies,
          } from "./lineTodayUx.ts";'''
          assert text.count(old_import) == 1, 'process-line-inbox import anchor drifted'
          text = text.replace(old_import, new_import, 1)

          old_today = '''  if (kind === "today") {
            const { data, error } = await client.rpc("server_read_line_today_daily_brief", {
              p_actor_id: actor.user_id,
            });
            if (error) {
              console.error("process-line-inbox: DailyBrief read failed", error.message);
              await sendConfirmation(
                client,
                item,
                actor,
                "今日の状況を読み込めませんでした。少し待ってからもう一度送ってください。",
                menuQuickReplies(),
              );
              return;
            }
            const text = typeof data === "string" && data.trim()
              ? data
              : "今日のおうちノート\\n\\n確認が必要な項目はありません。";
            await replyOrEnqueuePush(client, {
              replyToken: item.payload.replyToken,
              lineUserId: item.source_external_user_id,
              householdId: actor.household_id,
              recipientUserId: actor.user_id,
              text,
              quickReplyItems: menuQuickReplies(),
              dedupKey: `line-daily-brief:${item.provider_event_id}`,
            });
            return;
          }'''
          new_today = '''  if (kind === "today") {
            const [rendered, structured] = await Promise.all([
              client.rpc("server_read_line_today_daily_brief", { p_actor_id: actor.user_id }),
              client.rpc("server_read_daily_brief", { p_actor_id: actor.user_id, p_local_date: null }),
            ]);
            if (rendered.error || structured.error) {
              console.error(
                "process-line-inbox: DailyBrief read failed",
                rendered.error?.message ?? structured.error?.message ?? "unknown",
              );
              await sendConfirmation(
                client,
                item,
                actor,
                "今日の状況を読み込めませんでした。少し待ってからもう一度送ってください。",
                menuQuickReplies(),
              );
              return;
            }
            const baseText = typeof rendered.data === "string" && rendered.data.trim()
              ? rendered.data
              : "今日のおうちノート\\n\\n確認が必要な項目はありません。";
            const text = appendTodayDetailLinks(
              baseText,
              structured.data,
              Deno.env.get("APP_BASE_URL") ?? "",
            );
            await replyOrEnqueuePush(client, {
              replyToken: item.payload.replyToken,
              lineUserId: item.source_external_user_id,
              householdId: actor.household_id,
              recipientUserId: actor.user_id,
              text,
              quickReplyItems: todayContextQuickReplies(structured.data, menuQuickReplies()),
              dedupKey: `line-daily-brief:${item.provider_event_id}`,
            });
            return;
          }'''
          assert text.count(old_today) == 1, 'Today block anchor drifted'
          text = text.replace(old_today, new_today, 1)
          index.write_text(text)

          must = Path('supabase/functions/process-line-inbox/lineMustComplete.ts')
          text = must.read_text()
          anchor = '''} from "./routineItemFlow.ts";'''
          addition = anchor + '''
          import {
            handleHandoverAckPostback,
            isHandoverReviewText,
            openHandoverReview,
          } from "./lineHandoverFlow.ts";'''
          assert text.count(anchor) == 1, 'lineMustComplete import anchor drifted'
          text = text.replace(anchor, addition, 1)

          text_anchor = '''  if (isRequestText(text)) {
            await openRequests(ctx);
            return true;
          }
          if (isSimulationText(text)) {'''
          text_replacement = '''  if (isRequestText(text)) {
            await openRequests(ctx);
            return true;
          }
          if (isHandoverReviewText(text)) {
            await openHandoverReview(ctx);
            return true;
          }
          if (isSimulationText(text)) {'''
          assert text.count(text_anchor) == 1, 'lineMustComplete text-handler anchor drifted'
          text = text.replace(text_anchor, text_replacement, 1)

          postback_anchor = '''  if (action === "mc_request_repropose") {
            await reproposeRequest(ctx, fields);
            return true;
          }
          if (action?.startsWith("mc_sim_")) {'''
          postback_replacement = '''  if (action === "mc_request_repropose") {
            await reproposeRequest(ctx, fields);
            return true;
          }
          if (await handleHandoverAckPostback(ctx, fields)) {
            return true;
          }
          if (action?.startsWith("mc_sim_")) {'''
          assert text.count(postback_anchor) == 1, 'lineMustComplete postback anchor drifted'
          text = text.replace(postback_anchor, postback_replacement, 1)
          must.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'appendTodayDetailLinks' supabase/functions/process-line-inbox/index.ts
          grep -q 'openHandoverReview' supabase/functions/process-line-inbox/lineMustComplete.ts
          grep -q 'handleHandoverAckPostback' supabase/functions/process-line-inbox/lineMustComplete.ts

      - name: Commit candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name syoudai0514
          git config user.email syoudai0514@gmail.com
          git add supabase/functions/process-line-inbox/index.ts supabase/functions/process-line-inbox/lineMustComplete.ts
          git diff --cached --check
          git commit -m 'fix(f2): wire actionable LINE Today UX'
          git push origin HEAD:integration/family-ops-final-candidate
