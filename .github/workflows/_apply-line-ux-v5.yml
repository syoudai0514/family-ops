name: Apply LINE UX v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-line-ux-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Patch LINE UX
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B sol/line-ux-v5 origin/main
          python3 <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          write('supabase/functions/process-line-inbox/lineConversation.ts', r'''import type { LineQuickReplyAction } from '../_shared/lineMessaging.ts';

export type LineReadOnlyIntent = 'today' | 'tomorrow' | 'week' | 'menu';
export type LineCreationKind = 'event' | 'task' | 'request' | 'shopping';

function normalized(text: string): string {
  return text.normalize('NFKC').replace(/\s+/g, '').trim();
}

export function readOnlyLineIntent(text: string): LineReadOnlyIntent | null {
  const value = normalized(text);
  if (/^(?:メニュー(?:を)?(?:出して|見せて|表示して)?|何(?:が|を)?できる(?:んだっけ|の|こと)?|何できる(?:んだっけ)?|できること(?:は|教えて)?|使い方(?:は|教えて)?|ヘルプ(?:お願い)?)[？?。!！]*$/.test(value)) return 'menu';
  if (/^今週(?:の予定(?:は|教えて)?|どうなってる)?[？?]?$/.test(value)) return 'week';
  if (/^明日(?:の予定(?:は|教えて)?|なにある)?[？?]?$/.test(value)) return 'tomorrow';
  if (/^今日(?:の予定(?:は|教えて)?|なにある)?[？?]?$/.test(value)) return 'today';
  return null;
}

export function lineCreationStarterKind(text: string): LineCreationKind | null {
  const value = normalized(text).replace(/[。.!！?？]+$/g, '');
  const prefix = '(?:(?:パパ|ママ|父|母|お父さん|お母さん|嫁さん|奥さん|妻)に)?(?:(?:今日|明日|明後日)(?:の)?(?:朝|昼|夕方|夜)?(?:の|に)?)?';
  if (new RegExp(`^${prefix}(?:予定|単発予定)(?:を)?(?:追加|登録)(?:したい|して|する|お願い)?$`).test(value)) return 'event';
  if (new RegExp(`^${prefix}タスク(?:を)?(?:追加|登録)(?:したい|して|する|お願い)?$`).test(value)) return 'task';
  if (new RegExp(`^${prefix}(?:お願い|依頼)(?:を)?(?:送りたい|したい|送って|する)$`).test(value)) return 'request';
  if (/^(?:買い物|買うもの)(?:を)?(?:追加|登録)(?:したい|して|する|お願い)?$/.test(value)) return 'shopping';
  return null;
}

const message = (label: string, text = label): LineQuickReplyAction => ({ type: 'message', label, text });

export function menuQuickReplies(): LineQuickReplyAction[] {
  return [
    message('今日の予定', '今日の予定は？'),
    message('明日の予定', '明日の予定教えて'),
    message('今週の予定', '今週の予定は？'),
    message('予定を追加', '予定を追加したい'),
    message('タスク追加', 'タスクを追加したい'),
    message('お願い', 'お願いを送りたい'),
    message('買い物', '買い物を追加したい'),
    { type: 'uri', label: 'PWAを開く', uri: `${Deno.env.get('APP_BASE_URL') ?? ''}/today` },
  ];
}

export function completionHint(text: string): string {
  return `${text}\n\n💡 次もそのまま文章でOKです。「メニュー」でできることを確認できます。`;
}

export type CompactScheduleEntry = {
  title: string;
  startsAt: string | null;
  roleLabel?: string | null;
  conflict?: boolean;
};

export function formatScheduleReply(title: string, entries: CompactScheduleEntry[]): string {
  if (entries.length === 0) return `${title}\n\n予定はありません。`;
  const rendered = entries.slice(0, 8).map((entry) => {
    const time = entry.startsAt
      ? new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(entry.startsAt))
      : '終日';
    return `${time} ${entry.title}${entry.roleLabel ? `（${entry.roleLabel}）` : ''}${entry.conflict ? ' ⚠️' : ''}`;
  });
  const remaining = entries.length - rendered.length;
  return `${title}\n\n${rendered.join('\n')}${remaining > 0 ? `\nほか${remaining}件` : ''}`;
}
''')

          write('supabase/functions/process-line-inbox/lineConversation.test.ts', r'''import { assertEquals, assertStringIncludes } from 'jsr:@std/assert@1';
import { formatScheduleReply, lineCreationStarterKind, menuQuickReplies, readOnlyLineIntent } from './lineConversation.ts';

Deno.test('recognizes schedule/help as read-only', () => {
  assertEquals(readOnlyLineIntent('今日の予定は？'), 'today');
  assertEquals(readOnlyLineIntent('明日の予定教えて'), 'tomorrow');
  assertEquals(readOnlyLineIntent('今週どうなってる？'), 'week');
  assertEquals(readOnlyLineIntent('何ができる？'), 'menu');
  assertEquals(readOnlyLineIntent('何ができるんだっけ？'), 'menu');
  assertEquals(readOnlyLineIntent('メニュー出して'), 'menu');
  assertEquals(readOnlyLineIntent('明日の保険証を準備'), null);
});

Deno.test('vague creation starters enter clarification instead of help or fake task', () => {
  assertEquals(readOnlyLineIntent('明日の夜にタスクを追加したい'), null);
  assertEquals(lineCreationStarterKind('明日の夜にタスクを追加したい'), 'task');
  assertEquals(lineCreationStarterKind('予定を追加したい'), 'event');
  assertEquals(lineCreationStarterKind('お願いを送りたい'), 'request');
  assertEquals(lineCreationStarterKind('買い物を追加したい'), 'shopping');
  assertEquals(lineCreationStarterKind('明日の夜にゴミ出しをする'), null);
});

Deno.test('menu quick replies expose lookups and creation entry points', () => {
  assertEquals(menuQuickReplies().map((item) => item.label), ['今日の予定', '明日の予定', '今週の予定', '予定を追加', 'タスク追加', 'お願い', '買い物', 'PWAを開く']);
});

Deno.test('schedule reply remains compact', () => {
  const text = formatScheduleReply('今日の予定', Array.from({ length: 9 }, (_, index) => ({ title: `予定${index + 1}`, startsAt: '2026-08-23T01:30:00Z', roleLabel: index === 0 ? 'P' : null })));
  assertStringIncludes(text, '10:30 予定1（P）');
  assertStringIncludes(text, 'ほか1件');
});
''')

