name: Household recovery drill

# Run an actual recovery proof after a main-push-triggered backup (for example
# the protected merge that changes recovery code). Scheduled daily backups do
# not launch a heavy Supabase drill. Operators can also dispatch this workflow
# manually when recovery logic changes or evidence needs refreshing.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Backup (daily household recovery snapshot)"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: family-ops-household-recovery-drill
  cancel-in-progress: false

jobs:
  restore:
    name: Restore latest snapshot into disposable Supabase
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_PROJECT_REF: dnlqxjpjpkxnfgculzip
      TARGET_PROJECT_REF: wdwbmvpipbdpomqulsrj
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Write safe local Supabase placeholders
        shell: bash
        run: |
          cat > .env <<'EOF'
          GOOGLE_SIGNIN_CLIENT_ID=ci-recovery-placeholder.apps.googleusercontent.com
          GOOGLE_SIGNIN_CLIENT_SECRET=ci-recovery-placeholder
          GOOGLE_SIGNIN_CALLBACK_URL=http://127.0.0.1:54321/auth/v1/callback
          EOF
          cat .env >> "$GITHUB_ENV"

      - name: Start disposable Supabase stack
        run: |
          supabase start \
            --exclude realtime,storage-api,imgproxy,studio,mailpit,logflare,vector,supavisor,postgres-meta

      - name: Capture disposable DB connection
        run: supabase status -o json | node scripts/write_supabase_status_env.mjs

      - name: Apply current Family Ops schema from empty
        run: supabase db reset

      - name: Restore and verify latest household snapshot
        shell: bash
        run: bash scripts/restore_drill.sh --scratch-db-url "$DB_URL"

      - name: Stop disposable stack
        if: always()
        run: supabase stop
