name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Test
        run: npm run test -w apps/web

      - name: Build
        run: npm run build -w apps/web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  db:
    name: db SQL through ${{ matrix.stop_after }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stop_after: [31, 33, 35, 37, 38, 39, 40]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      SQL_TEST_STOP_AFTER: ${{ matrix.stop_after }}
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations + SQL test suite boundary
        run: bash scripts/run_sql_tests.sh

  edge-functions:
    name: edge-functions (deno lint / check / auth-matrix lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint
        working-directory: supabase/functions
        run: deno lint

      - name: Deno type-check
        working-directory: supabase/functions
        run: |
          for f in */index.ts; do
            echo "checking $f"
            deno check "$f"
          done

      - name: Deno unit tests (auth/crypto helpers)
        working-directory: supabase/functions
        run: deno test --allow-env

      - name: Edge auth matrix lint (config.toml vs EDGE_FUNCTION_AUTH_MATRIX.md)
        run: node scripts/check-edge-auth-matrix.mjs

  supabase-integration:
    name: supabase-integration (real CLI stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Write CI env files (placeholders, never committed)
        run: |
          cat > .env <<'EOF'
          GOOGLE_SIGNIN_CLIENT_ID=ci-test-google-client-id.apps.googleusercontent.com
          GOOGLE_SIGNIN_CLIENT_SECRET=ci-test-google-client-secret
          GOOGLE_SIGNIN_CALLBACK_URL=http://127.0.0.1:54321/auth/v1/callback
          EOF
          cat > supabase/functions/.env <<'EOF'
          LINE_CHANNEL_SECRET=ci-test-line-channel-secret
          CRON_WORKER_TOKEN=ci-test-worker-token-0123456789abcdef
          EOF
          cat .env >> "$GITHUB_ENV"

      - name: supabase start
        run: |
          supabase start \
            --exclude realtime,storage-api,imgproxy,studio,mailpit,logflare,vector,supavisor,postgres-meta

      - name: Capture local stack connection info
        run: supabase status -o json | node scripts/write_supabase_status_env.mjs

      - name: Reset DB (apply every migration from empty)
        run: supabase db reset

      - name: Seed jp_holidays fixture
        run: node scripts/seed_jp_holidays.mjs "$(echo "$DB_URL" | sed -E 's#.*/([^/?]+).*#\1#')"
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Real-stack integration tests
        run: bash scripts/run_supabase_integration_tests.sh
        env:
          LINE_CHANNEL_SECRET: ci-test-line-channel-secret
          CRON_WORKER_TOKEN: ci-test-worker-token-0123456789abcdef

      - name: supabase stop
        if: always()
        run: supabase stop
