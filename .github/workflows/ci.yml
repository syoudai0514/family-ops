name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Test
        run: npm run test -w apps/web

      - name: Build
        run: npm run build -w apps/web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  db:
    name: db (migrations / RLS / RPC / idempotency / quota)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations + SQL test suite
        run: bash scripts/run_sql_tests.sh

  edge-functions:
    name: edge-functions (deno lint / check / auth-matrix lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint
        working-directory: supabase/functions
        run: deno lint

      - name: Deno type-check
        working-directory: supabase/functions
        run: |
          for f in */index.ts; do
            echo "checking $f"
            deno check "$f"
          done

      - name: Deno unit tests (auth/crypto helpers)
        working-directory: supabase/functions
        run: deno test --allow-env

      - name: Edge auth matrix lint (config.toml vs EDGE_FUNCTION_AUTH_MATRIX.md)
        run: node scripts/check-edge-auth-matrix.mjs
