name: Deploy LINE mobile hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_deploy-line-mobile-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: family-ops-line-mobile-hotfix-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require deployment credential
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required."
            exit 1
          }
      - name: Deploy process-line-inbox
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy process-line-inbox \
            --project-ref "$PROJECT_REF" \
            --use-api
      - name: Verify deployed function is listed
        shell: bash
        run: supabase functions list --project-ref "$PROJECT_REF" | grep process-line-inbox
