name: Release nursery image pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-nursery-image-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require deployment credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy photo processing and receipt only
        run: |
          supabase functions deploy process-nursery-image-intake --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy line-webhook-receiver --project-ref "$PROJECT_REF" --use-api
