name: Today Navigation Evidence

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/run_today_navigation_browser_e2e.mjs'
      - '.github/workflows/today-navigation-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/run_today_navigation_browser_e2e.mjs'
      - '.github/workflows/today-navigation-evidence.yml'
  workflow_dispatch:

concurrency:
  group: today-navigation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: today/navigation (real Chrome mobile viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare stable Chrome DevTools endpoint
        shell: bash
        run: |
          set -euo pipefail
          REAL_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chrome)"
          test -n "$REAL_CHROME"
          WRAPPER="$RUNNER_TEMP/lane-d-chrome-wrapper.sh"
          cat > "$WRAPPER" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          user_data_dir=""
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*)
                user_data_dir="${arg#--user-data-dir=}"
                args+=("$arg")
                ;;
              --remote-debugging-port=0)
                args+=("--remote-debugging-port=9222" "--remote-debugging-address=127.0.0.1")
                ;;
              *) args+=("$arg") ;;
            esac
          done
          if [[ -n "$user_data_dir" ]]; then
            mkdir -p "$user_data_dir"
            printf '9222\n' > "$user_data_dir/DevToolsActivePort"
          fi
          exec "$REAL_CHROME" "${args[@]}"
          EOF
          chmod +x "$WRAPPER"
          echo "REAL_CHROME=$REAL_CHROME" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$WRAPPER" >> "$GITHUB_ENV"

      - name: Real Chrome Today/navigation E2E
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/run_today_navigation_browser_e2e.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-navigation-evidence-${{ github.sha }}
          path: artifacts/today-navigation-browser
          if-no-files-found: warn
          retention-days: 14
