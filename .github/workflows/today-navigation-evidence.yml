name: Today Navigation Evidence

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/run_today_navigation_browser_e2e.mjs'
      - 'scripts/run_today_navigation_browser_e2e_bounded.mjs'
      - '.github/workflows/today-navigation-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/run_today_navigation_browser_e2e.mjs'
      - 'scripts/run_today_navigation_browser_e2e_bounded.mjs'
      - '.github/workflows/today-navigation-evidence.yml'
  workflow_dispatch:

concurrency:
  group: today-navigation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: today/navigation (real Chrome mobile viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select real Chrome executable
        shell: bash
        run: |
          set -euo pipefail
          REAL_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chrome)"
          test -n "$REAL_CHROME"
          # The scenario runner intentionally launches Chrome with
          # --remote-debugging-port=0 and a dedicated user-data-dir. Chrome
          # writes the actual bound port to DevToolsActivePort only after the
          # endpoint is ready. Do not pre-create that file or force a fixed
          # port: doing so races startup and previously produced false CDP
          # connection failures on hosted runners.
          echo "CHROME_BIN=$REAL_CHROME" >> "$GITHUB_ENV"

      - name: Real Chrome Today/navigation E2E
        run: node scripts/run_today_navigation_browser_e2e_bounded.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-navigation-evidence-${{ github.sha }}
          path: artifacts/today-navigation-browser
          if-no-files-found: warn
          retention-days: 14
