name: Deploy LINE menu UX hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_deploy-line-menu-ux-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-ops-line-menu-ux-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dnlqxjpjpkxnfgculzip
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require deployment credential
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required."
            exit 1
          }
      - name: Deploy affected LINE Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in process-line-inbox process-pending-actions send-notifications; do
            echo "Deploying ${function_name}"
            supabase functions deploy "$function_name" --project-ref "$PROJECT_REF" --use-api
          done
      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
